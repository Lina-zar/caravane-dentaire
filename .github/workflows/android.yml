name: Application Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0E7C86' --splashBackgroundColor '#0E7C86'
      - name: Numéro de version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Compilation
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Caravane-Dentaire.apk aligned.apk
          $BT/apksigner verify Caravane-Dentaire.apk
      - uses: actions/upload-artifact@v4
        with: { name: Caravane-Dentaire-apk, path: Caravane-Dentaire.apk }
      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Caravane Dentaire (dernière version)
          body: "Fichier à installer sur Android : Caravane-Dentaire.apk"
          files: Caravane-Dentaire.apk
          make_latest: true
