name: Application Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0E7C86' --splashBackgroundColor '#0E7C86'
      - name: Numéro de version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Compilation
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Préparer le fichier
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk Caravane-Dentaire-non-signe.apk
      - uses: actions/upload-artifact@v4
        with: { name: Caravane-Dentaire-apk, path: Caravane-Dentaire-non-signe.apk }
      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Caravane Dentaire (dernière version)
          body: "Version non signée (la version à installer est envoyée signée séparément)."
          files: Caravane-Dentaire-non-signe.apk
          make_latest: true
