<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravane Dentaire</title>
<meta name="theme-color" content="#0E7C86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caravane">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* Mobile-first : en-tête, contenu défilant, barre d'onglets en bas */
  :root{
    --bg:#F3F5F4; --card:#FFFFFF; --ink:#18282B; --muted:#5E6E6C; --line:#DDE4E2; --field:#F8FAF9;
    --teal:#0E7C86; --teal-2:#1BB3C1; --teal-soft:#E1F3F4; --on-teal:#FFFFFF;
    --alert:#A63A2B; --alert-soft:#FBE7E2; --warn:#8A5A00; --warn-soft:#FFF2D6; --ok:#2E7D4F; --ok-soft:#E3F3E9;
    --radius:12px; --font:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0F1718; --card:#182325; --ink:#E3ECEA; --muted:#9AABA8; --line:#2A3A3C; --field:#132022;
      --teal:#2AA9B4; --teal-2:#43C5D1; --teal-soft:#123437; --on-teal:#04272A;
      --alert:#F08A78; --alert-soft:#3A1E1A; --warn:#E8B85A; --warn-soft:#352A12; --ok:#6CCB93; --ok-soft:#14301F; color-scheme:dark; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.4;}
  button,input,select,textarea{font:inherit; color:inherit;}
  [hidden]{display:none !important;}
  header.top{position:sticky; top:0; z-index:10; background:var(--teal); color:var(--on-teal);
    padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));}
  header.top .t{font-weight:700; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header.top .s{font-size:12.5px; opacity:.85;}
  main{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); max-width:760px; margin:0 auto;}
  nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:10; display:grid; grid-template-columns:repeat(5,1fr);
    background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px);}
  nav.tabs button{border:0; background:none; padding:8px 2px 9px; font-size:11.5px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
  nav.tabs button svg{width:24px; height:24px;}
  nav.tabs button.on{color:var(--teal); font-weight:700;}
  h2{font-size:19px; margin:4px 0 12px;}
  h3{font-size:15px; margin:18px 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:10px;}
  .row{display:flex; gap:10px; align-items:center;}
  .grow{flex:1; min-width:0;}
  .kpis{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:6px;}
  @media (min-width:600px){ .kpis{grid-template-columns:repeat(4,minmax(0,1fr));} }
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px;}
  .kpi .v{font-size:26px; font-weight:750; font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12.5px; color:var(--muted);}
  .kpi.main{background:var(--teal); border-color:var(--teal); color:var(--on-teal);} .kpi.main .l{color:inherit; opacity:.85;}
  .bars .b{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px; margin:8px 0; font-size:14px;}
  .bars .track{grid-column:1 / -1; height:8px; background:var(--teal-soft); border-radius:5px; overflow:hidden;}
  .bars .track span{display:block; height:100%; background:var(--teal); border-radius:5px;}
  .bars .n{font-variant-numeric:tabular-nums; font-weight:650;}
  .empty{color:var(--muted); font-size:14px; padding:6px 0;}
  .list .item{display:flex; gap:12px; align-items:center; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px; cursor:pointer;}
  .ref{font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:700; color:var(--teal); font-size:14px; min-width:62px;}
  .sub{font-size:13px; color:var(--muted);}
  .pill{display:inline-block; font-size:12px; font-weight:650; padding:2px 8px; border-radius:20px; background:var(--teal-soft); color:var(--teal); white-space:nowrap;}
  .pill.alert{background:var(--alert-soft); color:var(--alert);} .pill.warn{background:var(--warn-soft); color:var(--warn);} .pill.ok{background:var(--ok-soft); color:var(--ok);}
  .banner{background:var(--alert-soft); color:var(--alert); border-radius:10px; padding:10px 12px; font-weight:650; margin-bottom:10px; font-size:14.5px;}
  .search{display:flex; gap:8px; margin-bottom:10px;}
  label.f{display:block; margin-bottom:12px;}
  label.f > span{display:block; font-size:13px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  input,select,textarea{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--field); min-height:46px;}
  textarea{min-height:70px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal);}
  .two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--teal); background:var(--teal); color:var(--on-teal); border-radius:10px; padding:11px 16px; font-weight:700; min-height:46px; cursor:pointer;}
  .btn.ghost{background:transparent; color:var(--teal);}
  .btn.danger{background:transparent; color:var(--alert); border-color:var(--alert);}
  .btn.small{min-height:36px; padding:6px 12px; font-size:14px;}
  .btn.block{width:100%;}
  .btn:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--teal-2); outline-offset:2px;}
  .fab{position:fixed; right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:9; border-radius:28px; box-shadow:0 6px 16px rgba(0,0,0,.18); padding:0 20px; height:52px;}
  .seg{display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:12px;}
  .seg button{flex:1; border:0; background:none; padding:9px 4px; border-radius:8px; font-weight:650; color:var(--muted); cursor:pointer;}
  .seg button.on{background:var(--teal); color:var(--on-teal);}
  .tbl{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums;}
  .tbl th,.tbl td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
  .tbl th{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
  .tbl td.r,.tbl th.r{text-align:right;}
  .scroll{overflow-x:auto;}
  .sheet{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; justify-content:center;}
  .sheet .panel{background:var(--bg); width:100%; max-width:760px; max-height:92%; overflow-y:auto; border-radius:18px 18px 0 0;
    padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
  .sheet .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .sheet .head h2{margin:0;}
  .x{border:0; background:var(--card); border-radius:20px; width:38px; height:38px; font-size:20px; cursor:pointer;}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(140px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:20px; font-size:14px; z-index:30; max-width:90%;}
  .act{display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .act:last-child{border-bottom:0;}
  .confirm{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{border:1px solid var(--line); background:var(--card); border-radius:18px; padding:6px 10px; font-size:13.5px; cursor:pointer;}
  .chip.on{background:var(--teal); border-color:var(--teal); color:var(--on-teal);}
  .note{font-size:13px; color:var(--muted);}
  .menu .item{justify-content:space-between;}
  a.tel{color:var(--teal); font-weight:700; text-decoration:none;}
</style>
</head>
<body>
<header class="top"><div class="t" id="hdr-t">Caravane dentaire</div><div class="s" id="hdr-s"></div></header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="bilan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Bilan</button>
  <button data-tab="enfants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Enfants</button>
  <button data-tab="pharma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M12 11v6M9 14h6"/></svg>Pharmacie</button>
  <button data-tab="equipe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2.4.6 4 2.3 4 5.2"/></svg>Équipe</button>
  <button data-tab="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Plus</button>
</nav>
<div id="sheet-root"></div>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
